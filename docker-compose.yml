services:
  api:
    build: .
    ports:
      - "8050:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://payments:payments@db:5432/payments
    volumes:
      - .:/code
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
      POSTGRES_DB: payments
    ports:
      - "5437:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 3s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
