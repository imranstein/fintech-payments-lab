services:
  api:
    build: .
    ports:
      - "8050:8050"
    depends_on:
      - db
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
      POSTGRES_DB: payments
    ports:
      - "5437:5437"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
